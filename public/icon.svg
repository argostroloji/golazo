<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0033CC;stop-opacity:1" />
    </linearGradient>
    <clipPath id="ballClip">
      <circle cx="256" cy="210" r="118"/>
    </clipPath>
  </defs>

  <!-- Background square with rounded corners -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Subtle field lines -->
  <ellipse cx="256" cy="480" rx="200" ry="40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <line x1="256" y1="440" x2="256" y2="200" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Soccer ball base circle -->
  <circle cx="256" cy="210" r="118" fill="white"/>

  <!-- Ball shadow -->
  <circle cx="256" cy="210" r="118" fill="rgba(0,0,0,0.08)" transform="translate(6,8)"/>
  <circle cx="256" cy="210" r="118" fill="white"/>

  <!-- Pentagon patches (classic soccer ball pattern) -->
  <!-- Center pentagon -->
  <polygon points="256,162 287,184 275,219 237,219 225,184" fill="#111"/>

  <!-- Top -->
  <polygon points="256,92 278,108 270,136 242,136 234,108" fill="#111" opacity="0.85"/>

  <!-- Top-right -->
  <polygon points="316,128 338,150 327,178 299,175 291,147" fill="#111" opacity="0.85"/>

  <!-- Bottom-right -->
  <polygon points="320,240 334,268 315,290 289,280 285,252" fill="#111" opacity="0.85"/>

  <!-- Bottom-left -->
  <polygon points="192,240 196,268 220,280 246,270 227,248" fill="#111" opacity="0.85"/>

  <!-- Top-left -->
  <polygon points="196,128 172,150 183,178 211,175 219,147" fill="#111" opacity="0.85"/>

  <!-- Ball outline -->
  <circle cx="256" cy="210" r="118" fill="none" stroke="#0033CC" stroke-width="4"/>

  <!-- Shine highlight -->
  <ellipse cx="222" cy="168" rx="30" ry="18" fill="rgba(255,255,255,0.45)" transform="rotate(-30,222,168)"/>

  <!-- GOLAZO text -->
  <text
    x="256"
    y="390"
    text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-weight="900"
    font-size="82"
    fill="white"
    letter-spacing="4"
  >GOLAZO</text>

  <!-- Underline accent -->
  <rect x="96" y="406" width="320" height="5" rx="2.5" fill="rgba(255,255,255,0.4)"/>
</svg>
